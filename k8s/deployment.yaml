# MOCK-ONLY hosted build of mcp-gateway-lab for the SE cluster (rule 18). Same image as the standalone, MODE=mock,
# MGLAB_HOSTED=1 (the banner then says HOSTED SIMULATION). No secrets, no tenant ids, no volumes with data.
# Placeholders (__IMAGE__, __SE_HOST__, __INGRESS_CLASS__, __CLUSTER_ISSUER__) are filled by k8s/deploy.sh; nothing here names a real host or registry path.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gateway-lab
  labels: { app: mcp-gateway-lab }
spec:
  replicas: 1   # the only state is a small in-memory list of evaluations per workspace id (X-Workspace), so visitors are isolated by workspace; one pod because that state is not shared
  selector:
    matchLabels: { app: mcp-gateway-lab }
  template:
    metadata:
      labels: { app: mcp-gateway-lab }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: app
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 7660 }
          env:
            - { name: MODE, value: mock }
            - { name: MGLAB_HOSTED, value: "1" }
            - { name: MGLAB_PUBLIC_HOST, value: __SE_HOST__ }
            - { name: PORT, value: "7660" }
            - { name: MGLAB_BIND, value: 0.0.0.0 }
          readinessProbe:
            httpGet: { path: /api/health, port: http, httpHeaders: [{ name: Host, value: "127.0.0.1:7660" }] }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http, httpHeaders: [{ name: Host, value: "127.0.0.1:7660" }] }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 16Mi } }
